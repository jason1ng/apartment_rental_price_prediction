[server]
# Serves app/static/ (the folder beside the streamlit_app.py entrypoint) at
# /app/static/. The property viewer's three.js runtime loads from there as an
# ES module instead of being inlined into the page on every rerun.
enableStaticServing = true

[theme]
# Only [theme] (not [theme.light]/[theme.dark]) locks the app to this single
# mode — no dark option appears in the app's settings menu, and native
# widgets/charts (buttons, dataframes, the "streamlit" Altair theme) always
# render light regardless of the OS/browser theme. A warm cream palette with
# a terracotta accent, matching the glass
# palette in streamlit_app.py's custom CSS.
base = "light"
primaryColor = "#c15f3c"
backgroundColor = "#faf9f5"
secondaryBackgroundColor = "#f0eee6"
textColor = "#3d3929"
borderColor = "#e3ddce"
